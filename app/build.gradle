plugins {
    id 'com.android.application'
}
android {
    namespace 'org.oolah.s24backup'
    compileSdk 36
    defaultConfig {
        applicationId 'org.oolah.s24backup'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.hierynomus:smbj:0.15.0'
    implementation 'org.slf4j:slf4j-nop:2.0.17'
}
