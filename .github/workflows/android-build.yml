name: Android build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch verified Snapclient source and licenses
        run: python3 native/prepare.py

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --max-workers=2

      - name: Check API 26 compatibility
        run: ./gradlew :app:lintDebug -PapiCompatibilityCheck --stacktrace --max-workers=2

      - name: Verify both native receivers are packaged
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for abi in ('arm64-v8a', 'armeabi-v7a'):
                  assert len(apk.read(f'lib/{abi}/libsnapclient.so')) > 100000
              assert apk.read('assets/licenses/Snapcast-GPL-3.txt')
          PY

      - name: Package source archive
        run: |
          zip -qr SMBMusicPlayer_v0_4_3_source.zip . \
            -x '.git/*' \
               '.gradle/*' \
               '.kotlin/*' \
               '.idea/*' \
               'build/*' \
               'app/build/*' \
               'app/.cxx/*' \
               'gradle/wrapper/gradle-wrapper.jar' \
               'local.properties' \
               '*.iml' \
               'SMBMusicPlayer_v0_4_3_source.zip'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMBMusicPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: SMBMusicPlayer-v0.4.3-source
          path: SMBMusicPlayer_v0_4_3_source.zip
