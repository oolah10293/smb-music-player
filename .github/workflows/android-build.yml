name: Android build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --max-workers=2

      - name: Check API 26 compatibility
        run: ./gradlew :app:lintDebug -PapiCompatibilityCheck --stacktrace --max-workers=2

      - name: Verify standalone APK has no HOUSE engine
        run: |
          python3 - <<'PYAPK'
          import zipfile
          from pathlib import Path
          sources = Path('app/src/main/java')
          assert not (sources / 'com/smbmusic/player/house').exists()
          for source in sources.rglob('*.kt'):
              assert 'com.smbmusic.player.house' not in source.read_text(), source
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert not any('snapclient' in name.lower() for name in apk.namelist())
              for name in apk.namelist():
                  if name.endswith('.dex'):
                      assert b'Lcom/smbmusic/player/house/' not in apk.read(name)
          PYAPK

      - name: Package source archive
        run: |
          zip -qr SMBMusic-v0.5.1-source.zip . \
            -x '.git/*' \
               '.gradle/*' \
               '.kotlin/*' \
               '.idea/*' \
               'build/*' \
               'app/build/*' \
               'app/.cxx/*' \
               'house-app/*' \
               'gradle/wrapper/gradle-wrapper.jar' \
               'local.properties' \
               '*.iml' \
               'SMBMusic-v0.5.1-source.zip'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMBMusic-v0.5.1
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: SMBMusic-v0.5.1-source
          path: SMBMusic-v0.5.1-source.zip
